<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="RPS.css">
    <script src="RPS.js" defer></script>
</head>
<body>
<div class="main" id="ui">
    <div class="main" id="choicepanel">
        <div class="main" id="humanchoice">
            <p>Choose your weapon:</p>
            <div id="buttons">
                <button class="choice" id="rock"> Rock </button>
                <button class="choice" id="paper"> Paper </button>
                <button class="choice" id="scissors"> Scissors </button>
            </div>
            <p id="HC"> You choose: </p>
        </div>
        <div class="main" id="computerchoice">
            <p id="CC"> Your opponent choose: </p>
        </div>
    </div>
    <div class="main" id="win">
        <p id="winner"> The winner is: </p>
    </div>
    <div class="main" id="score">
        <p>SCORE</p> 
        <p id="scorenow"> Human: 0 - Computer: 0</p>
    </div>
</div>
</body>
</html>
